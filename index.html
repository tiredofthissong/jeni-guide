\n  <a href=\"#p2\" style=\"font-size: 14px; font-weight: 600; padding: 7px 16px; border-radius: 999px; background: #fff; border: 1px solid var(--color-border); color: var(--sand-stable);\">2. The Frameworks<\u002Fa>\n  <a href=\"#p3\" style=\"font-size: 14px; font-weight: 600; padding: 7px 16px; border-radius: 999px; background: #fff; border: 1px solid var(--color-border); color: var(--sand-stable);\">3. Prove It<\u002Fa>\n  <a href=\"#p4\" style=\"font-size: 14px; font-weight: 600; padding: 7px 16px; border-radius: 999px; background: #fff; border: 1px solid var(--color-border); color: var(--sand-stable);\">4. Do It<\u002Fa>\n<\u002Fdiv>\n\n<!-- ============ PAGE 1 ============ -->\n<section id=\"p1\" data-sheet=\"1\" data-screen-label=\"01\" style=\"width: 1056px; min-height: 816px; margin: 0 auto 30px; background: #fff; box-shadow: 0 18px 44px rgba(33,36,92,.16); padding: 38px 44px 34px; display: flex; flex-direction: column; gap: 22px;\">\n\n  <div style=\"display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid var(--sand-gray); padding-bottom: 14px;\">\n    <div style=\"display: flex; align-items: center; gap: 18px;\">\n      <x-import component-from-global-scope=\"SandlerDesignSystem_a441ea.Logo\" width=\"118\" hint-size=\"118px,26px\"><\u002Fx-import>\n      <span style=\"font-size: 14px; font-weight: 600; color: var(--sand-ink-70); letter-spacing: .04em;\">Field Guide for Jeni Green · Part 1<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display: flex; align-items: baseline; gap: 12px;\">\n      <span style=\"font-size: 15px; font-weight: 600; color: var(--sand-stable);\">Where context lives<\u002Fspan>\n      <span style=\"font-size: 13px; font-weight: 700; color: var(--sand-fresh);\">1 / 4<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"background: var(--sand-stable); color: #fff; border-radius: 14px; padding: 26px 32px 22px; display: flex; flex-direction: column; gap: 10px;\">\n    <span style=\"font-size: 12px; font-weight: 700; letter-spacing: .16em; color: var(--sand-fresh); text-transform: uppercase;\">The whole guide in one sentence<\u002Fspan>\n    <p style=\"margin: 0; font-size: 30px; line-height: 1.24; font-weight: 600; color: #fff; max-width: 900px;\">\"AI is only as good as the context I gave it — everything else is just a different way of giving it context.\"<\u002Fp>\n    <p style=\"margin: 0; font-size: 15px; color: #cfd3ec;\">Everything on the next four pages is one of those different ways. That is the whole trick.<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"display: flex; gap: 30px; align-items: flex-start;\">\n\n    <div style=\"width: 404px; flex: 0 0 404px;\">\n      <div style=\"display: flex; align-items: center; gap: 8px; margin-bottom: 8px;\">\n        <span style=\"font-size: 13px; font-weight: 700; color: var(--sand-fresh); letter-spacing: .08em; text-transform: uppercase;\">Click a ring<\u002Fspan>\n        <span data-screen-only=\"1\" style=\"font-size: 16px; color: var(--sand-fresh); display: inline-block; animation: nudge 1.8s ease-in-out infinite;\">→<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"position: relative; width: 400px; height: 400px; margin: 0 auto;\">\n        <div sc-camel-on-click=\"{{ pick5 }}\" style=\"position: absolute; left: 0; top: 0; width: 400px; height: 400px; border-radius: 50%; background: #f4f5f8; cursor: pointer; z-index: 1; border: 3px solid; border-color: {{ b5 }};\">\n          <span style=\"position: absolute; left: 50%; top: 8px; transform: translateX(-50%); font-size: 15px; font-weight: 700; color: var(--sand-stable); white-space: nowrap;\">5 · Connectors<\u002Fspan>\n        <\u002Fdiv>\n        <div sc-camel-on-click=\"{{ pick4 }}\" style=\"position: absolute; left: 42px; top: 42px; width: 316px; height: 316px; border-radius: 50%; background: #e6e8f0; cursor: pointer; z-index: 2; border: 3px solid; border-color: {{ b4 }};\">\n          <span style=\"position: absolute; left: 50%; top: 7px; transform: translateX(-50%); font-size: 14px; font-weight: 700; color: var(--sand-stable); white-space: nowrap;\">4 · New chat<\u002Fspan>\n        <\u002Fdiv>\n        <div sc-camel-on-click=\"{{ pick3 }}\" style=\"position: absolute; left: 82px; top: 82px; width: 236px; height: 236px; border-radius: 50%; background: #d6d9e6; cursor: pointer; z-index: 3; border: 3px solid; border-color: {{ b3 }};\">\n          <span style=\"position: absolute; left: 50%; top: 7px; transform: translateX(-50%); font-size: 14px; font-weight: 700; color: var(--sand-stable); white-space: nowrap;\">3 · This chat<\u002Fspan>\n        <\u002Fdiv>\n        <div sc-camel-on-click=\"{{ pick2 }}\" style=\"position: absolute; left: 122px; top: 122px; width: 156px; height: 156px; border-radius: 50%; background: #b9bdd4; cursor: pointer; z-index: 4; border: 3px solid; border-color: {{ b2 }};\">\n          <span style=\"position: absolute; left: 50%; top: 7px; transform: translateX(-50%); font-size: 13px; font-weight: 700; color: var(--sand-stable); white-space: nowrap;\">2 · Projects<\u002Fspan>\n        <\u002Fdiv>\n        <div sc-camel-on-click=\"{{ pick1 }}\" style=\"position: absolute; left: 156px; top: 156px; width: 88px; height: 88px; border-radius: 50%; background: var(--sand-stable); cursor: pointer; z-index: 5; display: flex; align-items: center; justify-content: center; text-align: center; border: 3px solid; border-color: {{ b1 }};\">\n          <span style=\"font-size: 12px; font-weight: 700; color: #fff; line-height: 1.2; padding: 0 6px;\">1 · Memory<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"margin: 10px 0 0; text-align: center; font-size: 13px; color: var(--sand-ink-70);\">Center sticks forever. Outward, it sticks for less time.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 12px;\">\n\n      <div data-expand=\"1\" style=\"border: 2px solid var(--sand-fresh); border-radius: 12px; padding: 16px 18px; background: #f5fcff; display: {{ d1 }};\">\n        <div style=\"display: flex; align-items: center; gap: 10px; margin-bottom: 8px;\">\n          <x-import component-from-global-scope=\"SandlerDesignSystem_a441ea.Badge\" color=\"fresh\" hint-size=\"auto,22px\">Ring 1<\u002Fx-import>\n          <h3 style=\"margin: 0; font-size: 21px;\">Custom instructions &amp; memory<\u002Fh3>\n        <\u002Fdiv>\n        <p style=\"margin: 0 0 6px; font-size: 16px; line-height: 1.45;\">The standing facts about you that follow you into every chat you ever open.<\u002Fp>\n        <p style=\"margin: 0 0 6px; font-size: 16px; line-height: 1.45;\"><strong style=\"color: var(--sand-stable);\">Your version:<\u002Fstrong> \"I run Sandler's November Conference. I live in Smartsheet and SharePoint. Short sentences, no corporate filler.\"<\u002Fp>\n        <p style=\"margin: 0 0 6px; font-size: 16px; line-height: 1.45;\"><strong style=\"color: var(--sand-stable);\">Lasts:<\u002Fstrong> forever. You edit it by telling it what changed. \"We moved to Nashville.\" Done. No settings form.<\u002Fp>\n      <\u002Fdiv>\n\n      <div data-expand=\"1\" style=\"border: 2px solid var(--sand-fresh); border-radius: 12px; padding: 16px 18px; background: #f5fcff; display: {{ d2 }};\">\n        <div style=\"display: flex; align-items: center; gap: 10px; margin-bottom: 8px;\">\n          <x-import component-from-global-scope=\"SandlerDesignSystem_a441ea.Badge\" color=\"fresh\" hint-size=\"auto,22px\">Ring 2<\u002Fx-import>\n          <h3 style=\"margin: 0; font-size: 21px;\">Projects<\u002Fh3>\n        <\u002Fdiv>\n        <p style=\"margin: 0 0 6px; font-size: 16px; line-height: 1.45;\">A project is a folder that holds files plus its own standing instructions <em>(a \"project\" here just means a labeled workspace inside ChatGPT)<\u002Fem>.<\u002Fp>\n        <p style=\"margin: 0 0 6px; font-size: 16px; line-height: 1.45;\"><strong style=\"color: var(--sand-stable);\">Your version:<\u002Fstrong> a November Conference project holding the run of show, the speaker grid, and the rule \"always give me tables I can paste into Smartsheet.\"<\u002Fp>\n        <p style=\"margin: 0 0 6px; font-size: 16px; line-height: 1.45;\"><strong style=\"color: var(--sand-stable);\">Lasts:<\u002Fstrong> across every chat inside it. New chats open already briefed.<\u002Fp>\n      <\u002Fdiv>\n\n      <div data-expand=\"1\" style=\"border: 2px solid var(--sand-fresh); border-radius: 12px; padding: 16px 18px; background: #f5fcff; display: {{ d3 }};\">\n        <div style=\"display: flex; align-items: center; gap: 10px; margin-bottom: 8px;\">\n          <x-import component-from-global-scope=\"SandlerDesignSystem_a441ea.Badge\" color=\"fresh\" hint-size=\"auto,22px\">Ring 3<\u002Fx-import>\n          <h3 style=\"margin: 0; font-size: 21px;\">This chat<\u002Fh3>\n        <\u002Fdiv>\n        <p style=\"margin: 0 0 6px; font-size: 16px; line-height: 1.45;\">Everything you have said in this one conversation, still sitting in front of it.<\u002Fp>\n        <p style=\"margin: 0 0 6px; font-size: 16px; line-height: 1.45;\"><strong style=\"color: var(--sand-stable);\">Your version:<\u002Fstrong> you paste the speaker grid at 9am. At 11am, in the same chat, \"who is still missing travel?\" works.<\u002Fp>\n        <p style=\"margin: 0 0 6px; font-size: 16px; line-height: 1.45;\"><strong style=\"color: var(--sand-stable);\">Lasts:<\u002Fstrong> until you leave. Close the chat and that grid was never here.<\u002Fp>\n      <\u002Fdiv>\n\n      <div data-expand=\"1\" style=\"border: 2px solid var(--sand-fresh); border-radius: 12px; padding: 16px 18px; background: #f5fcff; display: {{ d4 }};\">\n        <div style=\"display: flex; align-items: center; gap: 10px; margin-bottom: 8px;\">\n          <x-import component-from-global-scope=\"SandlerDesignSystem_a441ea.Badge\" color=\"fresh\" hint-size=\"auto,22px\">Ring 4<\u002Fx-import>\n          <h3 style=\"margin: 0; font-size: 21px;\">A new chat<\u002Fh3>\n        <\u002Fdiv>\n        <p style=\"margin: 0 0 6px; font-size: 16px; line-height: 1.45;\">A stranger walks in mid-conversation with no idea what you are talking about.<\u002Fp>\n        <p style=\"margin: 0 0 6px; font-size: 16px; line-height: 1.45;\"><strong style=\"color: var(--sand-stable);\">Your version:<\u002Fstrong> \"can you fix the times?\" The stranger has never seen your agenda. It will guess, confidently.<\u002Fp>\n        <p style=\"margin: 0 0 6px; font-size: 16px; line-height: 1.45;\"><strong style=\"color: var(--sand-stable);\">Lasts:<\u002Fstrong> zero seconds. Everything it knows is what you are about to type, plus rings 1 and 2.<\u002Fp>\n      <\u002Fdiv>\n\n      <div data-expand=\"1\" style=\"border: 2px solid var(--sand-fresh); border-radius: 12px; padding: 16px 18px; background: #f5fcff; display: {{ d5 }};\">\n        <div style=\"display: flex; align-items: center; gap: 10px; margin-bottom: 8px;\">\n          <x-import component-from-global-scope=\"SandlerDesignSystem_a441ea.Badge\" color=\"fresh\" hint-size=\"auto,22px\">Ring 5<\u002Fx-import>\n          <h3 style=\"margin: 0; font-size: 21px;\">Connectors<\u002Fh3>\n        <\u002Fdiv>\n        <p style=\"margin: 0 0 6px; font-size: 16px; line-height: 1.45;\">Two people who want the same thing but speak different languages, learning just enough words to cooperate <em>(a connector is that shared vocabulary between ChatGPT and another app)<\u002Fem>.<\u002Fp>\n        <p style=\"margin: 0 0 6px; font-size: 16px; line-height: 1.45;\"><strong style=\"color: var(--sand-stable);\">Yours, already on:<\u002Fstrong> Fathom hands over the transcript. Smartsheet hands over the row. monday and Canva are in too.<\u002Fp>\n        <p style=\"margin: 0 0 6px; font-size: 16px; line-height: 1.45;\"><strong style=\"color: var(--sand-stable);\">Lasts:<\u002Fstrong> as long as the connection is on and your permissions allow it. This is context you did not have to type.<\u002Fp>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"margin-top: auto; display: flex; align-items: center; gap: 14px; border-top: 2px solid var(--sand-gray); padding-top: 14px;\">\n    <span style=\"flex: 0 0 auto; width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--sand-fresh); display: flex; align-items: center; justify-content: center; font-size: 15px; color: var(--sand-stable); font-weight: 700;\">◈<\u002Fspan>\n    <div>\n      <div style=\"font-size: 11px; font-weight: 700; letter-spacing: .16em; color: var(--sand-fresh); text-transform: uppercase;\">Context compass<\u002Fdiv>\n      <div style=\"font-size: 16px; font-weight: 500; color: var(--sand-stable);\">Context has a shelf life. Pick the ring that matches how long you need it to stick.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ PAGE 2 ============ -->\n<section id=\"p2\" data-sheet=\"1\" data-screen-label=\"02\" style=\"width: 1056px; min-height: 816px; margin: 0 auto 30px; background: #fff; box-shadow: 0 18px 44px rgba(33,36,92,.16); padding: 38px 44px 34px; display: flex; flex-direction: column; gap: 20px;\">\n\n  <div style=\"display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid var(--sand-gray); padding-bottom: 14px;\">\n    <div style=\"display: flex; align-items: center; gap: 18px;\">\n      <x-import component-from-global-scope=\"SandlerDesignSystem_a441ea.Logo\" width=\"118\" hint-size=\"118px,26px\"><\u002Fx-import>\n      <span style=\"font-size: 14px; font-weight: 600; color: var(--sand-ink-70); letter-spacing: .04em;\">Field Guide for Jeni Green · Part 1<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display: flex; align-items: baseline; gap: 12px;\">\n      <span style=\"font-size: 15px; font-weight: 600; color: var(--sand-stable);\">The frameworks<\u002Fspan>\n      <span style=\"font-size: 13px; font-weight: 700; color: var(--sand-fresh);\">2 / 4<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display: flex; align-items: flex-end; justify-content: space-between; gap: 20px;\">\n    <div>\n      <h2 style=\"margin: 0 0 4px; font-size: 32px;\">CLEAR lives inside RACE<\u002Fh2>\n      <p style=\"margin: 0; font-size: 16px; color: var(--sand-ink-70);\">RACE is the shape of the whole prompt. CLEAR is how you write the middle of it.<\u002Fp>\n    <\u002Fdiv>\n    <button sc-camel-on-click=\"{{ toggleBoth }}\" data-screen-only=\"1\" style=\"flex: 0 0 auto; font-family: var(--font-sans); font-size: 14px; font-weight: 600; padding: 10px 18px; border-radius: 999px; border: 2px solid var(--sand-stable); background: #fff; color: var(--sand-stable); cursor: pointer;\">{{ bothLabel }}<\u002Fbutton>\n  <\u002Fdiv>\n\n  <div data-expand-flex=\"1\" style=\"display: {{ dTurn }}; gap: 26px; align-items: flex-start;\">\n    <div style=\"flex: 0 0 500px; width: 500px;\">\n      <div style=\"position: relative; width: 500px; height: 500px;\">\n        <div style=\"position: absolute; left: 50%; top: 50%; width: 392px; height: 392px; margin: -196px 0 0 -196px; border-radius: 50%; border: 2px dashed #b9bdd4;\"><\u002Fdiv>\n        <div style=\"position: absolute; left: 50%; top: 50%; width: 272px; height: 272px; margin: -136px 0 0 -136px; border-radius: 50%; background: #eaf8ff; border: 2px solid var(--sand-fresh);\"><\u002Fdiv>\n        <div style=\"position: absolute; left: 50%; top: 50%; width: 104px; margin: -24px 0 0 -52px; text-align: center; z-index: 2;\">\n          <div style=\"font-size: 15px; font-weight: 700; letter-spacing: .08em; color: var(--sand-fresh);\">CLEAR<\u002Fdiv>\n          <div style=\"font-size: 11px; font-weight: 600; letter-spacing: .06em; color: var(--sand-ink-70); text-transform: uppercase;\">inside Action<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"position: absolute; left: 0; top: 0; width: 100%; height: 100%; transition: transform .55s cubic-bezier(.4,.1,.2,1); transform: rotate({{ raceRot }});\">\n\n          <div sc-camel-on-click=\ Fspan>\n            <span style=\"font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;\">Context<\u002Fspan>\n          <\u002Fdiv>\n          <div sc-camel-on-click=\"{{ pR3 }}\" style=\"position: absolute; left: 50%; top: 50%; width: 104px; height: 104px; margin: -52px 0 0 -52px; border-radius: 16px; background: var(--sand-stable); color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transform: rotate(180deg) translateY(-196px) rotate(-180deg) rotate({{ raceCtr }}); transition: transform .55s cubic-bezier(.4,.1,.2,1); box-shadow: {{ sR3 }};\">\n            <span style=\"font-size: 34px; font-weight: 700; line-height: 1;\">E<\u002Fspan>\n            <span style=\"font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;\">Execute<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"position: absolute; left: 0; top: 0; width: 100%; height: 100%; transition: transform .55s cubic-bezier(.4,.1,.2,1); transform: rotate({{ clearRot }});\">\n          <div sc-camel-on-click=\"{{ pC0 }}\" style=\"position: absolute; left: 50%; top: 50%; width: 76px; height: 76px; margin: -38px 0 0 -38px; border-radius: 50%; background: #fff; border: 2px solid var(--sand-stable); display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transform: rotate(0deg) translateY(-94px) rotate(0deg) rotate({{ clearCtr }}); transition: transform .55s cubic-bezier(.4,.1,.2,1); box-shadow: {{ sC0 }};\">\n            <span style=\"font-size: 24px; font-weight: 700; line-height: 1; color: var(--sand-stable);\">C<\u002Fspan>\n            <span style=\"font-size: 11px; font-weight: 600; color: var(--sand-ink-70);\">Concise<\u002Fspan>\n          <\u002Fdiv>\n          <div sc-camel-on-click=\"{{ pC1 }}\" style=\"position: absolute; left: 50%; top: 50%; width: 76px; height: 76px; margin: -38px 0 0 -38px; border-radius: 50%; background: #fff; border: 2px solid var(--sand-stable); display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transform: rotate(72deg) translateY(-94px) rotate(-72deg) rotate({{ clearCtr }}); transition: transform .55s cubic-bezier(.4,.1,.2,1); box-shadow: {{ sC1 }};\">\n            <span style=\"font-size: 24px; font-weight: 700; line-height: 1; color: var(--sand-stable);\">L<\u002Fspan>\n            <span style=\"font-size: 11px; font-weight: 600; color: var(--sand-ink-70);\">Limits<\u002Fspan>\n          <\u002Fdiv>\n          <div sc-camel-on-click=\"{{ pC2 }}\" style=\"position: absolute; left: 50%; top: 50%; width: 76px; height: 76px; margin: -38px 0 0 -38px; border-radius: 50%; background: #fff; border: 2px solid var(--sand-stable); display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transform: rotate(144deg) translateY(-94px) rotate(-144deg) rotate({{ clearCtr }}); transition: transform .55s cubic-bezier(.4,.1,.2,1); box-shadow: {{ sC2 }};\">\n            <span style=\"font-size: 24px; font-weight: 700; line-height: 1; color: var(--sand-stable);\">E<\u002Fspan>\n            <span style=\"font-size: 11px; font-weight: 600; color: var(--sand-ink-70);\">Examples<\u002Fspan>\n          <\u002Fdiv>\n          <div sc-camel-on-click=\"{{ pC3 }}\" style=\"position: absolute; left: 50%; top: 50%; width: 76px; height: 76px; margin: -38px 0 0 -38px; border-radius: 50%; background: #fff; border: 2px solid var(--sand-stable); display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transform: rotate(216deg) translateY(-94px) rotate(-216deg) rotate({{ clearCtr }}); transition: transform .55s cubic-bezier(.4,.1,.2,1); box-shadow: {{ sC3 }};\">\n            <span style=\"font-size: 24px; font-weight: 700; line-height: 1; color: var(--sand-stable);\">A<\u002Fspan>\n            <span style=\"font-size: 11px; font-weight: 600; color: var(--sand-ink-70);\">Ask<\u002Fspan>\n          <\u002Fdiv>\n          <div sc-camel-on-click=\"{{ pC4 }}\" style=\"position: absolute; left: 50%; top: 50%; width: 76px; height: 76px; margin: -38px 0 0 -38px; border-radius: 50%; background: #fff; border: 2px solid var(--sand-stable); display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transform: rotate(288deg) translateY(-94px) rotate(-288deg) rotate({{ clearCtr }}); transition: transform .55s cubic-bezier(.4,.1,.2,1); box-shadow: {{ sC4 }};\">\n            <span style=\"font-size: 24px; font-weight: 700; line-height: 1; color: var(--sand-stable);\">R<\u002Fspan>\n            <span style=\"font-size: 11px; font-weight: 600; color: var(--sand-ink-70);\">References<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"margin: 4px 0 0; text-align: center; font-size: 13px; font-weight: 600; color: var(--sand-fresh);\">Outer ring is RACE. Inner ring is CLEAR. Click any letter, it spins to the top.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"flex: 1; min-width: 0;\">\n\n      <div data-expand=\"1\" style=\"border-radius: 12px; border: 2px solid var(--sand-stable); padding: 18px 20px; margin-bottom: 10px; display: {{ dR0 }};\">\n        <div style=\"display: flex; align-items: center; gap: 10px; margin-bottom: 8px;\"><x-import component-from-global-scope=\"SandlerDesignSystem_a441ea.Badge\" color=\"stable\" hint-size=\"auto,22px\">RACE · R<\u002Fx-import><h3 style=\"margin: 0; font-size: 22px;\">Role<\u002Fh3><\u002Fdiv>\n        <p style=\"margin: 0 0 8px; font-size: 16px; line-height: 1.45;\">Tell it who it is before you tell it what to do.<\u002Fp>\n        <p style=\"margin: 0 0 8px; font-size: 16px; line-height: 1.45;\"><strong style=\"color: var(--sand-stable);\">November:<\u002Fstrong> \"You are an event operations coordinator running a multi-track annual conference.\"<\u002Fp>\n        <p style=\"margin: 0; font-size: 15px; color: var(--sand-fresh); font-weight: 600;\">◈ A role is context about who is doing the work.<\u002Fp>\n      <\u002Fdiv>\n\n      <div data-expand=\"1\" style=\"border-radius: 12px; border: 2px solid var(--sand-stable); padding: 18px 20px; margin-bottom: 10px; display: {{ dR1 }};\">\n        <div style=\"display: flex; align-items: center; gap: 10px; margin-bottom: 8px;\"><x-import component-from-global-scope=\"SandlerDesignSystem_a441ea.Badge\" color=\"fresh\" hint-size=\"auto,22px\">RACE · A<\u002Fx-import><h3 style=\"margin: 0; font-size: 22px;\">Action<\u002Fh3><\u002Fdiv>\n        <p style=\"margin: 0 0 8px; font-size: 16px; line-height: 1.45;\">The verb. Draft, sort, compare, summarize. All five CLEAR letters live inside this one.<\u002Fp>\n        <p style=\"margin: 0 0 8px; font-size: 16px; line-height: 1.45;\"><strong style=\"color: var(--sand-stable);\">November:<\u002Fstrong> \"Draft the speaker confirmation email for the six breakout leads.\"<\u002Fp>\n        <p style=\"margin: 0; font-size: 15px; color: var(--sand-fresh); font-weight: 600;\">◈ The action tells it which job it is actually on.<\u002Fp>\n      <\u002Fdiv>\n\n      <div data-expand=\"1\" style=\"border-radius: 12px; border: 2px solid var(--sand-stable); padding: 18px 20px; margin-bottom: 10px; display: {{ dR2 }};\">\n        <div style=\"display: flex; align-items: center; gap: 10px; margin-bottom: 8px;\"><x-import component-from-global-scope=\"SandlerDesignSystem_a441ea.Badge\" color=\"stable\" hint-size=\"auto,22px\">RACE · C<\u002Fx-import><h3 style=\"margin: 0; font-size: 22px;\">Context<\u002Fh3><\u002Fdiv>\n        <p style=\"margin: 0 0 8px; font-size: 16px; line-height: 1.45;\">The real inputs. Files, constraints, last year's version, what changed.<\u002Fp>\n        <p style=\"margin: 0 0 8px; font-size: 16px; line-height: 1.45;\"><strong style=\"color: var(--sand-stable);\">November:<\u002Fstrong> paste the speaker grid, last year's run of show, and \"we lost two breakout rooms.\"<\u002Fp>\n        <p style=\"margin: 0; font-size: 15px; color: var(--sand-fresh); font-weight: 600;\">◈ This is what you would tell a new hire on day one.<\u002Fp>\n      <\u002Fdiv>\n\n      <div data-expand=\"1\" style=\"border-radius: 12px; border: 2px solid var(--sand-stable); padding: 18px 20px; margin-bottom: 10px; display: {{ dR3 }};\">\n        <div style=\"display: flex; align-items: center; gap: 10px; margin-bottom: 8px;\"><x-import component-from-global-scope=\"SandlerDesignSystem_a441ea.Badge\" color=\"stable\" hint-size=\"auto,22px\">RACE · E<\u002Fx-import><h3 style=\"margin: 0; font-size: 22px;\">Execute<\u002Fh3><\u002Fdiv>\n        <p style=\"margin: 0 0 8px; font-size: 16px; line-height: 1.45;\">What shape should the answer arrive in, and where is it going.<\u002Fp>\n        <p style=\"margin: 0 0 8px; font-size: 16px; line-height: 1.45;\"><strong style=\"color: var(--sand-stable);\">November:<\u002Fstrong> \"Give me a table with speaker, session, room, travel status. Nothing else.\"<\u002Fp>\n        <p style=\"margin: 0; font-size: 15px; color: var(--sand-fresh); font-weight: 600;\">◈ Format is context. It says where this is about to land.<\u002Fp>\n      <\u002Fdiv>\n\n      <div data-expand=\"1\" style=\"border-radius: 12px; border: 2px solid var(--sand-fresh); background: #f5fcff; padding: 18px 20px; margin-bottom: 10px; display: {{ dC0 }};\">\n        <div style=\"display: flex; align-items: center; gap: 10px; margin-bottom: 8px;\"><x-import component-from-global-scope=\"SandlerDesignSystem_a441ea.Badge\" color=\"fresh\" hint-size=\"auto,22px\">CLEAR · C<\u002Fx-import><h3 style=\"margin: 0; font-size: 22px;\">Concise<\u002Fh3><\u002Fdiv>\n        <p style=\"margin: 0 0 8px; font-size: 16px; line-height: 1.45;\">Say it plainly. Cut the throat-clearing.<\u002Fp>\n        <p style=\"margin: 0 0 8px; font-size: 16px; line-height: 1.45;\"><strong style=\"color: var(--sand-stable);\">November:<\u002Fstrong> not \"circle back on speaker logistics.\" Say \"list every speaker with no travel date.\"<\u002Fp>\n        <p style=\"margin: 0; font-size: 15px; color: var(--sand-fresh); font-weight: 600;\">◈ Noise is context too. Just the wrong kind.<\u002Fp>\n      <\u002Fdiv>\n\n      <div data-expand=\"1\" style=\"border-radius: 12px; border: 2px solid var(--sand-fresh); background: #f5fcff; padding: 18px 20px; margin-bottom: 10px; display: {{ dC1 }};\">\n        <div style=\"display: flex; align-items: center; gap: 10px; margin-bottom: 8px;\"><x-import component-from-global-scope=\"SandlerDesignSystem_a441ea.Badge\" color=\"fresh\" hint-size=\"auto,22px\">CLEAR · L<\u002Fx-import><h3 style=\"margin: 0; font-size: 22px;\">Limitations<\u002Fh3><\u002Fdiv>\n        <p style=\"margin: 0 0 8px; font-size: 16px; line-height: 1.45;\">What not to do. \"Only the last two years.\" \"We don't have a food truck.\"<\u002Fp>\n        <p style=\"margin: 0 0 8px; font-size: 16px; line-height: 1.45;\"><strong style=\"color: var(--sand-stable);\">November:<\u002Fstrong> \"Breakouts only. Ignore general sessions. Do not invent room numbers.\"<\u002Fp>\n        <p style=\"margin: 0; font-size: 15px; color: var(--sand-fresh); font-weight: 600;\">◈ Fencing the yard is context. It says where not to wander.<\u002Fp>\n      <\u002Fdiv>\n\n      <div data-expand=\"1\" style=\"border-radius: 12px; border: 2px solid var(--sand-fresh); background: #f5fcff; padding: 18px 20px; margin-bottom: 10px; display: {{ dC2 }};\">\n        <div style=\"display: flex; align-items: center; gap: 10px; margin-bottom: 8px;\"><x-import component-from-global-scope=\"SandlerDesignSystem_a441ea.Badge\" color=\"fresh\" hint-size=\"auto,22px\">CLEAR · E<\u002Fx-import><h3 style=\"margin: 0; font-size: 22px;\">Examples<\u002Fh3><\u002Fdiv>\n        <p style=\"margin: 0 0 8px; font-size: 16px; line-height: 1.45;\">Show it, do not describe it.<\u002Fp>\n        <p style=\"margin: 0 0 8px; font-size: 16px; line-height: 1.45;\"><strong style=\"color: var(--sand-stable);\">November:<\u002Fstrong> paste the recap you were proud of and say \"match this one.\"<\u002Fp>\n        <p style=\"margin: 0; font-size: 15px; color: var(--sand-fresh); font-weight: 600;\">◈ One example carries more context than five adjectives.<\u002Fp>\n      <\u002Fdiv>\n\n      <div data-expand=\"1\" style=\"border-radius: 12px; border: 2px solid var(--sand-fresh); background: #f5fcff; padding: 18px 20px; margin-bottom: 10px; display: {{ dC3 }};\">\n        <div style=\"display: flex; align-items: center; gap: 10px; margin-bottom: 8px;\"><x-import component-from-global-scope=\"SandlerDesignSystem_a441ea.Badge\" color=\"fresh\" hint-size=\"auto,22px\">CLEAR · A<\u002Fx-import><h3 style=\"margin: 0; font-size: 22px;\">Ask questions<\u002Fh3><\u002Fdiv>\n        <p style=\"margin: 0 0 8px; font-size: 16px; line-height: 1.45;\">End with \"what did I not think of?\" Then answer it.<\u002Fp>\n        <p style=\"margin: 0 0 8px; font-size: 16px; line-height: 1.45;\"><strong style=\"color: var(--sand-stable);\">November:<\u002Fstrong> it comes back with \"do you want AV needs in this?\" and you had forgotten AV.<\u002Fp>\n        <p style=\"margin: 0; font-size: 15px; color: var(--sand-fresh); font-weight: 600;\">◈ It is asking for the context you forgot to hand over.<\u002Fp>\n      <\u002Fdiv>\n\n      <div data-expand=\"1\" style=\"border-radius: 12px; border: 2px solid var(--sand-fresh); background: #f5fcff; padding: 18px 20px; margin-bottom: 10px; display: {{ dC4 }};\">\n        <div style=\"display: flex; align-items: center; gap: 10px; margin-bottom: 8px;\"><x-import component-from-global-scope=\"SandlerDesignSystem_a441ea.Badge\" color=\"fresh\" hint-size=\"auto,22px\">CLEAR · R<\u002Fx-import><h3 style=\"margin: 0; font-size: 22px;\">References<\u002Fh3><\u002Fdiv>\n        <p style=\"margin: 0 0 8px; font-size: 16px; line-height: 1.45;\">Make it show its work. This is your audit habit, written into the prompt.<\u002Fp>\n        <p style=\"margin: 0 0 8px; font-size: 16px; line-height: 1.45;\"><strong style=\"color: var(--sand-stable);\">November:<\u002Fstrong> \"For every date, tell me the line of the transcript it came from.\"<\u002Fp>\n        <p style=\"margin: 0; font-size: 15px; color: var(--sand-fresh); font-weight: 600;\">◈ Sources let you check the context it actually used.<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"border-radius: 12px; background: var(--sand-gray); padding: 14px 18px;\">\n        <p style=\"margin: 0; font-size: 15px; line-height: 1.45; color: var(--sand-stable);\">You will find a dozen versions of CLEAR online, all slightly different. All of them are fine. A framework is a recipe card, not a law. Adapt it and it is yours.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div data-expand=\"1\" style=\"display: {{ dSide }};\">\n    <div style=\"display: flex; gap: 24px;\">\n      <div style=\"flex: 1; border: 2px solid var(--sand-stable); border-radius: 12px; padding: 18px 20px;\">\n        <h3 style=\"margin: 0 0 4px; font-size: 24px;\">RACE<\u002Fh3>\n        <p style=\"margin: 0 0 14px; font-size: 14px; color: var(--sand-ink-70);\">The shape of the whole prompt.<\u002Fp>\n        <p style=\"margin: 0 0 10px; font-size: 16px; line-height: 1.4;\"><strong style=\"color: var(--sand-fresh);\">R · Role<\u002Fstrong><br>Who it is. \"You are an event operations coordinator.\"<\u002Fp>\n        <p style=\"margin: 0 0 10px; font-size: 16px; line-height: 1.4;\"><strong style=\"color: var(--sand-fresh);\">A · Action<\u002Fstrong><br>The verb. All of CLEAR happens in here.<\u002Fp>\n        <p style=\"margin: 0 0 10px; font-size: 16px; line-height: 1.4;\"><strong style=\"color: var(--sand-fresh);\">C · Context<\u002Fstrong><br>Real inputs. The grid, the constraints, what changed.<\u002Fp>\n        <p style=\"margin: 0; font-size: 16px; line-height: 1.4;\"><strong style=\"color: var(--sand-fresh);\">E · Execute<\u002Fstrong><br>The format. Table, email, bullet list, Smartsheet paste.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"flex: 1; border: 2px solid var(--sand-fresh); background: #f5fcff; border-radius: 12px; padding: 18px 20px;\">\n        <h3 style=\"margin: 0 0 4px; font-size: 24px;\">CLEAR<\u002Fh3>\n        <p style=\"margin: 0 0 14px; font-size: 14px; color: var(--sand-ink-70);\">How you write the Action.<\u002Fp>\n        <p style=\"margin: 0 0 10px; font-size: 16px; line-height: 1.4;\"><strong style=\"color: var(--sand-fresh);\">C · Concise<\u002Fstrong><br>Say it plainly, cut the noise.<\u002Fp>\n        <p style=\"margin: 0 0 10px; font-size: 16px; line-height: 1.4;\"><strong style=\"color: var(--sand-fresh);\">L · Limitations<\u002Fstrong><br>What not to do. No food truck.<\u002Fp>\n        <p style=\"margin: 0 0 10px; font-size: 16px; line-height: 1.4;\"><strong style=\"color: var(--sand-fresh);\">E · Examples<\u002Fstrong><br>Show it, do not describe it.<\u002Fp>\n        <p style=\"margin: 0 0 10px; font-size: 16px; line-height: 1.4;\"><strong style=\"color: var(--sand-fresh);\">A · Ask questions<\u002Fstrong><br>\"What did I not think of?\"<\u002Fp>\n        <p style=\"margin: 0; font-size: 16px; line-height: 1.4;\"><strong style=\"color: var(--sand-fresh);\">R · References<\u002Fstrong><br>Audit it. Make it show its work.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"margin-top: auto; display: flex; align-items: center; gap: 14px; border-top: 2px solid var(--sand-gray); padding-top: 14px;\">\n    <span style=\"flex: 0 0 auto; width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--sand-fresh); display: flex; align-items: center; justify-content: center; font-size: 15px; color: var(--sand-stable); font-weight: 700;\">◈<\u002Fspan>\n    <div>\n      <div style=\"font-size: 11px; font-weight: 700; letter-spacing: .16em; color: var(--sand-fresh); text-transform: uppercase;\">Context compass<\u002Fdiv>\n      <div style=\"font-size: 16px; font-weight: 500; color: var(--sand-stable);\">Both acronyms are just checklists for handing over context you already have in your head.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ PAGE 3 ============ -->\n<section id=\"p3\" data-sheet=\"1\" data-screen-label=\"03\" style=\"width: 1056px; min-height: 816px; margin: 0 auto 30px; background: #fff; box-shadow: 0 18px 44px rgba(33,36,92,.16); padding: 38px 44px 34px; display: flex; flex-direction: column; gap: 20px;\">\n\n  <div style=\"display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid var(--sand-gray); padding-bottom: 14px;\">\n    <div style=\"display: flex; align-items: center; gap: 18px;\">\n      <x-import component-from-global-scope=\"SandlerDesignSystem_a441ea.Logo\" width=\"118\" hint-size=\"118px,26px\"><\u002Fx-import>\n      <span style=\"font-size: 14px; font-weight: 600; color: var(--sand-ink-70); letter-spacing: .04em;\">Field Guide for Jeni Green · Part 1<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display: flex; align-items: baseline; gap: 12px;\">\n      <span style=\"font-size: 15px; font-weight: 600; color: var(--sand-stable);\">Prove it<\u002Fspan>\n      <span style=\"font-size: 13px; font-weight: 700; color: var(--sand-fresh);\">3 / 4<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div>\n    <h2 style=\"margin: 0 0 4px; font-size: 30px;\">One task, two versions of you<\u002Fh2>\n    <p style=\"margin: 0; font-size: 16px; color: var(--sand-ink-70);\">The task: write the follow-up email after my speaker logistics call. Drag the handle and watch what changes.<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"border: 2px solid var(--sand-gray); border-radius: 14px; padding: 18px 20px;\">\n    <div data-screen-only=\"1\" style=\"display: flex; align-items: center; gap: 16px; margin-bottom: 6px;\">\n      <span style=\"font-size: 14px; font-weight: 700; color: var(--sand-ink-70); letter-spacing: .1em;\">VAGUE<\u002Fspan>\n      <input type=\"range\" min=\"0\" max=\"5\" step=\"1\" value=\"{{ step }}\" sc-camel-on-change=\"{{ onStep }}\" sc-camel-on-input=\"{{ onStep }}\" style=\"flex: 1;\">\n      <span style=\"font-size: 14px; font-weight: 700; color: var(--sand-fresh); letter-spacing: .1em;\">BUILT<\u002Fspan>\n    <\u002Fdiv>\n    <div data-screen-only=\"1\" style=\"display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; color: var(--sand-ink-70); margin: 0 62px 14px;\">\n      <span>start<\u002Fspan><span>+role<\u002Fspan><span>+limits<\u002Fspan><span>+example<\u002Fspan><span>+ask<\u002Fspan><span>+audit<\u002Fspan>\n    <\u002Fdiv>\n\n    <div style=\"display: flex; gap: 20px; align-items: stretch;\">\n      <div style=\"flex: 1; min-width: 0; background: #f7f8fb; border-radius: 10px; padding: 16px 18px;\">\n        <div style=\"font-size: 11px; font-weight: 700; letter-spacing: .14em; color: var(--sand-ink-70); text-transform: uppercase; margin-bottom: 10px;\">What I typed<\u002Fdiv>\n        <p style=\"margin: 0 0 9px; font-size: 15px; line-height: 1.45; color: var(--sand-stable);\">Write the follow-up email about my speaker call.<\u002Fp>\n        <p data-dim=\"1\" style=\"margin: 0 0 9px; font-size: 15px; line-height: 1.45; color: var(--sand-stable); opacity: {{ o1 }}; transition: opacity .25s;\"><strong style=\"color: var(--sand-fresh);\">Role. <\u002Fstrong>You are an event operations coordinator at Sandler.<\u002Fp>\n        <p data-dim=\"1\" style=\"margin: 0 0 9px; font-size: 15px; line-height: 1.45; color: var(--sand-stable); opacity: {{ o2 }}; transition: opacity .25s;\"><strong style=\"color: var(--sand-fresh);\">Limits. <\u002Fstrong>Only Tuesday's speaker logistics call. Skip the budget thread. Do not invent dates.<\u002Fp>\n        <p data-dim=\"1\" style=\"margin: 0 0 9px; font-size: 15px; line-height: 1.45; color: var(--sand-stable); opacity: {{ o3 }}; transition: opacity .25s;\"><strong style=\"color: var(--sand-fresh);\">Example. <\u002Fstrong>Match the recap I sent last week: short sentences, warm, no filler.<\u002Fp>\n        <p data-dim=\"1\" style=\"margin: 0 0 9px; font-size: 15px; line-height: 1.45; color: var(--sand-stable); opacity: {{ o4 }}; transition: opacity .25s;\"><strong style=\"color: var(--sand-fresh);\">Ask. <\u002Fstrong>Before you draft, ask me three questions about what the call left open.<\u002Fp>\n        <p data-dim=\"1\" style=\"margin: 0; font-size: 15px; line-height: 1.45; color: var(--sand-stable); opacity: {{ o5 }}; transition: opacity .25s;\"><strong style=\"color: var(--sand-fresh);\">Audit. <\u002Fstrong>Flag anything you inferred rather than heard, so I can check it.<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"flex: 1; min-width: 0; background: var(--sand-stable); border-radius: 10px; padding: 16px 18px; color: #fff; display: flex; flex-direction: column;\">\n        <div style=\"font-size: 11px; font-weight: 700; letter-spacing: .14em; color: var(--sand-fresh); text-transform: uppercase; margin-bottom: 10px;\">What came back<\u002Fdiv>\n        <p style=\"margin: 0 0 12px; font-size: 15px; line-height: 1.5; color: #fff; white-space: pre-line; flex: 1;\">{{ outBody }}<\u002Fp>\n        <p style=\"margin: 0; font-size: 14px; font-weight: 600; color: var(--sand-limitless);\">{{ outVerdict }}<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div data-print-only=\"1\" style=\"margin-top: 14px; font-size: 14px; line-height: 1.5; color: var(--sand-stable);\">\n      <strong>Printed version.<\u002Fstrong> At the VAGUE end the reply is \"Hi! Great chatting today. Following up on our conversation.\" At the BUILT end it asks three real questions first, then returns a recap with decisions, open items, owners, and an INFERRED flag on anything it guessed. Same task. Six extra lines of context.\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"border: 2px solid var(--sand-gray); border-radius: 14px; padding: 18px 20px;\">\n    <div style=\"display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 6px;\">\n      <div>\n        <h3 style=\"margin: 0 0 4px; font-size: 24px;\">Accept, verify, escalate<\u002Fh3>\n        <p style=\"margin: 0; font-size: 15px; color: var(--sand-ink-70); max-width: 620px;\">You already audit everything, which puts you in a very small minority of people using this stuff. You do not need the habit. You need three named buckets for it.<\u002Fp>\n      <\u002Fdiv>\n      <button sc-camel-on-click=\"{{ toggleAnswers }}\" data-screen-only=\"1\" style=\"flex: 0 0 auto; font-family: var(--font-sans); font-size: 14px; font-weight: 600; padding: 10px 18px; border-radius: 999px; border: 2px solid var(--sand-stable); background: #fff; color: var(--sand-stable); cursor: pointer;\">{{ answersLabel }}<\u002Fbutton>\n    <\u002Fdiv>\n\n    <p style=\"margin: 0 0 12px; font-size: 15px; color: var(--sand-stable); font-style: italic;\">Ben's rule: you would trust a stranger to work a thousand times harder than you. You would never let that stranger present your work to your boss unchecked.<\u002Fp>\n\n    <div data-screen-only=\"1\" style=\"display: flex; align-items: center; gap: 10px; margin-bottom: 8px;\">\n      <span style=\"font-size: 13px; font-weight: 700; color: var(--sand-fresh); letter-spacing: .08em; text-transform: uppercase;\">Grab a card, drop it in a bucket<\u002Fspan>\n      <span style=\"font-size: 12px; color: var(--sand-ink-70);\">(or click a card, then click a bucket)<\u002Fspan>\n    <\u002Fdiv>\n\n    <div data-screen-only=\"1\" style=\"display: flex; flex-wrap: wrap; gap: 8px; min-height: 46px; padding: 8px; border: 2px dashed var(--color-border); border-radius: 10px; margin-bottom: 12px;\">\n      <sc-for list=\"{{ trayItems }}\" as=\"t\" hint-placeholder-count=\"6\">\n        <div draggable=\"true\" data-id=\"{{ t.id }}\" sc-camel-on-drag-start=\"{{ onDragStart }}\" sc-camel-on-click=\"{{ onChipClick }}\" style=\"display: flex; align-items: center; gap: 8px; padding: 8px 13px; border-radius: 9px; border: 2px solid var(--sand-stable); background: #fff; cursor: grab; font-size: 14px; font-weight: 600; color: var(--sand-stable); box-shadow: {{ t.ring }};\">\n          <span style=\"color: var(--sand-fresh); font-size: 14px; letter-spacing: 1px;\">⠿<\u002Fspan>\n          <span>{{ t.label }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <div data-screen-only=\"1\" style=\"display: flex; gap: 12px;\">\n      <div data-bucket=\"accept\" sc-camel-on-drop=\"{{ onDrop }}\" sc-camel-on-drag-over=\"{{ onDragOver }}\" sc-camel-on-click=\"{{ onBucketClick }}\" style=\"flex: 1; min-height: 150px; border-radius: 10px; border: 2px solid var(--sand-fresh); background: #f5fcff; padding: 10px 12px;\">\n        <div style=\"font-size: 13px; font-weight: 700; letter-spacing: .1em; color: var(--sand-fresh); text-transform: uppercase; margin-bottom: 8px;\">Accept · use as is<\u002Fdiv>\n        <sc-for list=\"{{ acceptItems }}\" as=\"t\" hint-placeholder-count=\"2\">\n          <div draggable=\"true\" data-id=\"{{ t.id }}\" sc-camel-on-drag-start=\"{{ onDragStart }}\" style=\"margin-bottom: 7px; padding: 8px 10px; border-radius: 8px; background: #fff; border: 2px solid; border-color: {{ t.edge }}; cursor: grab;\">\n            <div style=\"font-size: 14px; font-weight: 600; color: var(--sand-stable);\">{{ t.label }}<\u002Fdiv>\n            <div style=\"font-size: 12.5px; line-height: 1.35; color: {{ t.noteColor }};\">{{ t.note }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div data-bucket=\"verify\" sc-camel-on-drop=\"{{ onDrop }}\" sc-camel-on-drag-over=\"{{ onDragOver }}\" sc-camel-on-click=\"{{ onBucketClick }}\" style=\"flex: 1; min-height: 150px; border-radius: 10px; border: 2px solid var(--sand-limitless); background: #fffaf0; padding: 10px 12px;\">\n        <div style=\"font-size: 13px; font-weight: 700; letter-spacing: .1em; color: #a06a10; text-transform: uppercase; margin-bottom: 8px;\">Verify · check it first<\u002Fdiv>\n        <sc-for list=\"{{ verifyItems }}\" as=\"t\" hint-placeholder-count=\"2\">\n          <div draggable=\"true\" data-id=\"{{ t.id }}\" sc-camel-on-drag-start=\"{{ onDragStart }}\" style=\"margin-bottom: 7px; padding: 8px 10px; border-radius: 8px; background: #fff; border: 2px solid; border-color: {{ t.edge }}; cursor: grab;\">\n            <div style=\"font-size: 14px; font-weight: 600; color: var(--sand-stable);\">{{ t.label }}<\u002Fdiv>\n            <div style=\"font-size: 12.5px; line-height: 1.35; color: {{ t.noteColor }};\">{{ t.note }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div data-bucket=\"escalate\" sc-camel-on-drop=\"{{ onDrop }}\" sc-camel-on-drag-over=\"{{ onDragOver }}\" sc-camel-on-click=\"{{ onBucketClick }}\" style=\"flex: 1; min-height: 150px; border-radius: 10px; border: 2px solid var(--sand-passionate); background: #fef5f6; padding: 10px 12px;\">\n        <div style=\"font-size: 13px; font-weight: 700; letter-spacing: .1em; color: var(--sand-passionate); text-transform: uppercase; margin-bottom: 8px;\">Escalate · a human signs off<\u002Fdiv>\n        <sc-for list=\"{{ escalateItems }}\" as=\"t\" hint-placeholder-count=\"2\">\n          <div draggable=\"true\" data-id=\"{{ t.id }}\" sc-camel-on-drag-start=\"{{ onDragStart }}\" style=\"margin-bottom: 7px; padding: 8px 10px; border-radius: 8px; background: #fff; border: 2px solid; border-color: {{ t.edge }}; cursor: grab;\">\n            <div style=\"font-size: 14px; font-weight: 600; color: var(--sand-stable);\">{{ t.label }}<\u002Fdiv>\n            <div style=\"font-size: 12.5px; line-height: 1.35; color: {{ t.noteColor }};\">{{ t.note }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div data-expand=\"1\" style=\"margin-top: 14px; display: {{ dKey }};\">\n      <div style=\"font-size: 12px; font-weight: 700; letter-spacing: .14em; color: var(--sand-ink-70); text-transform: uppercase; margin-bottom: 8px;\">Answer key<\u002Fdiv>\n      <div style=\"display: flex; gap: 12px;\">\n        <div style=\"flex: 1; border-left: 4px solid var(--sand-fresh); padding-left: 12px;\">\n          <p style=\"margin: 0 0 9px; font-size: 14.5px; line-height: 1.4;\"><strong>Reformat the speaker list into a table.<\u002Fstrong><br>Accept. Wrong output is obvious in two seconds.<\u002Fp>\n          <p style=\"margin: 0; font-size: 14.5px; line-height: 1.4;\"><strong>Rewrite my rough agenda note in plainer words.<\u002Fstrong><br>Accept. It is your words, shorter. You would spot a change instantly.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"flex: 1; border-left: 4px solid var(--sand-limitless); padding-left: 12px;\">\n          <p style=\"margin: 0 0 9px; font-size: 14.5px; line-height: 1.4;\"><strong>Themes across 200 FBR survey comments.<\u002Fstrong><br>Verify. Spot check ten comments before you quote a number.<\u002Fp>\n          <p style=\"margin: 0; font-size: 14.5px; line-height: 1.4;\"><strong>Recap doc from a speaker logistics call.<\u002Fstrong><br>Verify. Check the dates and the owners. Those are the parts people act on.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"flex: 1; border-left: 4px solid var(--sand-passionate); padding-left: 12px;\">\n          <p style=\"margin: 0 0 9px; font-size: 14.5px; line-height: 1.4;\"><strong>Final budget figures in the leadership deck.<\u002Fstrong><br>Escalate. Numbers with your name on them go past a human.<\u002Fp>\n          <p style=\"margin: 0; font-size: 14.5px; line-height: 1.4;\"><strong>Email to a franchisee about a schedule change.<\u002Fstrong><br>Escalate. It leaves the building under Sandler's name.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"margin-top: auto; display: flex; align-items: center; gap: 14px; border-top: 2px solid var(--sand-gray); padding-top: 14px;\">\n    <span style=\"flex: 0 0 auto; width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--sand-fresh); display: flex; align-items: center; justify-content: center; font-size: 15px; color: var(--sand-stable); font-weight: 700;\">◈<\u002Fspan>\n    <div>\n      <div style=\"font-size: 11px; font-weight: 700; letter-spacing: .16em; color: var(--sand-fresh); text-transform: uppercase;\">Context compass<\u002Fdiv>\n      <div style=\"font-size: 16px; font-weight: 500; color: var(--sand-stable);\">Every notch on that slider is one more piece of context. The model never changed.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ PAGE 4 ============ -->\n<section id=\"p4\" data-sheet=\"1\" data-screen-label=\"04\" style=\"width: 1056px; min-height: 816px; margin: 0 auto 30px; background: #fff; box-shadow: 0 18px 44px rgba(33,36,92,.16); padding: 38px 44px 34px; display: flex; flex-direction: column; gap: 18px;\">\n\n  <div style=\"display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid var(--sand-gray); padding-bottom: 14px;\">\n    <div style=\"display: flex; align-items: center; gap: 18px;\">\n      <x-import component-from-global-scope=\"SandlerDesignSystem_a441ea.Logo\" width=\"118\" hint-size=\"118px,26px\"><\u002Fx-import>\n      <span style=\"font-size: 14px; font-weight: 600; color: var(--sand-ink-70); letter-spacing: .04em;\">Field Guide for Jeni Green · Part 1<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display: flex; align-items: baseline; gap: 12px;\">\n      <span style=\"font-size: 15px; font-weight: 600; color: var(--sand-stable);\">Do it<\u002Fspan>\n      <span style=\"font-size: 13px; font-weight: 700; color: var(--sand-fresh);\">4 / 4<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div>\n    <h2 style=\"margin: 0 0 4px; font-size: 30px;\">Three things, this week<\u002Fh2>\n    <p style=\"margin: 0; font-size: 16px; color: var(--sand-ink-70);\">One section at a time. Click a header to open it.<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"border: 2px solid var(--sand-stable); border-radius: 12px; overflow: hidden;\">\n    <div sc-camel-on-click=\"{{ accA }}\" style=\"display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 18px; background: var(--sand-stable); cursor: pointer;\">\n      <div style=\"display: flex; align-items: baseline; gap: 12px;\">\n        <span style=\"font-size: 12px; font-weight: 700; letter-spacing: .16em; color: var(--sand-fresh);\">A<\u002Fspan>\n        <span style=\"font-size: 21px; font-weight: 600; color: #fff;\">Build your first skill<\u002Fspan>\n        <span style=\"font-size: 14px; color: #b9c0e0;\">page 3 was writing the recipe from scratch. every single time.<\u002Fspan>\n      <\u002Fdiv>\n      <span style=\"font-size: 18px; color: var(--sand-fresh); font-weight: 700;\">{{ arrA }}<\u002Fspan>\n    <\u002Fdiv>\n    <div data-expand=\"1\" style=\"padding: 18px 20px; display: {{ dA }};\">\n      <div style=\"display: flex; gap: 22px; align-items: flex-start;\">\n        <div style=\"flex: 1; min-width: 0;\">\n          <p style=\"margin: 0 0 10px; font-size: 16px; line-height: 1.5;\">You bake. You do not re-derive the cookie from first principles every December. You pull the card. A skill is the card <em>(a skill is a saved set of instructions ChatGPT runs whenever you say the trigger phrase)<\u002Fem>.<\u002Fp>\n          <div style=\"font-size: 12px; font-weight: 700; letter-spacing: .14em; color: var(--sand-ink-70); text-transform: uppercase; margin: 14px 0 8px;\">Where to click<\u002Fdiv>\n          <p style=\"margin: 0 0 5px; font-size: 15px; line-height: 1.45;\"><strong style=\"color: var(--sand-fresh);\">1.<\u002Fstrong> Open ChatGPT. Click your name, bottom left.<\u002Fp>\n          <p style=\"margin: 0 0 5px; font-size: 15px; line-height: 1.45;\"><strong style=\"color: var(--sand-fresh);\">2.<\u002Fstrong> Settings, then Personalization.<\u002Fp>\n          <p style=\"margin: 0 0 5px; font-size: 15px; line-height: 1.45;\"><strong style=\"color: var(--sand-fresh);\">3.<\u002Fstrong> Find Skills. Click New skill.<\u002Fp>\n          <p style=\"margin: 0 0 5px; font-size: 15px; line-height: 1.45;\"><strong style=\"color: var(--sand-fresh);\">4.<\u002Fstrong> Paste the block on the right. Save. Say \"meeting recap\" in any chat.<\u002Fp>\n          <p style=\"margin: 12px 0 0; font-size: 14px; line-height: 1.45; color: var(--sand-ink-70);\">Can't find Skills? Type \"skills\" into the settings search. The menu moves around. Skills are new and OpenAI keeps rearranging the furniture. If a step does not match your screen, that is the tool, not you.<\u002Fp>\n\n          <div style=\"font-size: 12px; font-weight: 700; letter-spacing: .14em; color: var(--sand-ink-70); text-transform: uppercase; margin: 16px 0 8px;\">What fires when you say it<\u002Fdiv>\n          <div style=\"display: flex; flex-wrap: wrap; gap: 7px;\">\n            <span style=\"padding: 8px 12px; border-radius: 8px; background: var(--sand-stable); color: #fff; font-size: 13px; font-weight: 600; animation: flowPulse 3.6s ease-in-out infinite; animation-delay: 0s;\">1 · you say it<\u002Fspan>\n            <span style=\"align-self: center; color: var(--sand-fresh); font-weight: 700;\">›<\u002Fspan>\n            <span style=\"padding: 8px 12px; border-radius: 8px; background: var(--sand-stable); color: #fff; font-size: 13px; font-weight: 600; animation: flowPulse 3.6s ease-in-out infinite; animation-delay: .5s;\">2 · finds the Fathom call<\u002Fspan>\n            <span style=\"align-self: center; color: var(--sand-fresh); font-weight: 700;\">›<\u002Fspan>\n            <span style=\"padding: 8px 12px; border-radius: 8px; background: var(--sand-stable); color: #fff; font-size: 13px; font-weight: 600; animation: flowPulse 3.6s ease-in-out infinite; animation-delay: 1s;\">3 · \"want past calls too?\"<\u002Fspan>\n            <span style=\"align-self: center; color: var(--sand-fresh); font-weight: 700;\">›<\u002Fspan>\n            <span style=\"padding: 8px 12px; border-radius: 8px; background: var(--sand-stable); color: #fff; font-size: 13px; font-weight: 600; animation: flowPulse 3.6s ease-in-out infinite; animation-delay: 1.5s;\">4 · pulls back 60 days<\u002Fspan>\n            <span style=\"align-self: center; color: var(--sand-fresh); font-weight: 700;\">›<\u002Fspan>\n            <span style=\"padding: 8px 12px; border-radius: 8px; background: var(--sand-stable); color: #fff; font-size: 13px; font-weight: 600; animation: flowPulse 3.6s ease-in-out infinite; animation-delay: 2s;\">5 · asks you 3 real questions<\u002Fspan>\n            <span style=\"align-self: center; color: var(--sand-fresh); font-weight: 700;\">›<\u002Fspan>\n            <span style=\"padding: 8px 12px; border-radius: 8px; background: var(--sand-fresh); color: #fff; font-size: 13px; font-weight: 600; animation: flowPulse 3.6s ease-in-out infinite; animation-delay: 2.5s;\">6 · recap doc + email<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"flex: 0 0 430px; width: 430px;\">\n          <div style=\"display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px;\">\n            <span style=\"font-size: 12px; font-weight: 700; letter-spacing: .14em; color: var(--sand-ink-70); text-transform: uppercase;\">Paste this in<\u002Fspan>\n            <button sc-camel-on-click=\"{{ copySkill }}\" data-screen-only=\"1\" style=\"font-family: var(--font-sans); font-size: 13px; font-weight: 600; padding: 7px 16px; border-radius: 999px; border: 2px solid var(--sand-fresh); background: var(--sand-fresh); color: #fff; cursor: pointer;\">{{ copyLabel }}<\u002Fbutton>\n          <\u002Fdiv>\n          <pre ref=\"{{ refSkill }}\" style=\"margin: 0; white-space: pre-wrap; font-family: 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 12.5px; line-height: 1.5; color: var(--sand-stable); background: #f7f8fb; border: 2px solid var(--color-border); border-radius: 10px; padding: 14px 16px;\">NAME: Meeting Recap\n\nTRIGGER PHRASES: \"meeting recap\", \"follow up email after call\", \"recap my call with ___\"\n\nSTEPS:\n1. Search Fathom for my most recent call matching the person or topic I named. Read the FULL transcript, not the summary.\n2. Before doing anything else, ask me: \"Want me to pull transcripts from previous calls with this person too?\"\n3. If yes, search Fathom back 60 days for every call including that person and read those full transcripts as well.\n4. Ask me AT LEAST 3 clarifying questions drawn from what you actually read. Reference specifics, not generic questions. Good example: \"You two left the speaker gift count open. List that as an open item or leave it out?\"\n5. Draft the recap in MY voice: warm, direct, plain language, short sentences, no corporate filler, light exclamation points, no em-dashes.\n6. Output two things: (a) a structured recap doc with Decisions / Open Items / Owners and Dates, and (b) a short follow-up email ready to send.\n7. Flag anything you inferred rather than heard, so I can audit it.<\u002Fpre>\n          <p style=\"margin: 10px 0 0; font-size: 15px; font-weight: 600; color: var(--sand-fresh);\">◈ A skill is context you never have to retype.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"border: 2px solid var(--sand-stable); border-radius: 12px; overflow: hidden;\">\n    <div sc-camel-on-click=\"{{ accB }}\" style=\"display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 18px; background: var(--sand-stable); cursor: pointer;\">\n      <div style=\"display: flex; align-items: baseline; gap: 12px;\">\n        <span style=\"font-size: 12px; font-weight: 700; letter-spacing: .16em; color: var(--sand-fresh);\">B<\u002Fspan>\n        <span style=\"font-size: 21px; font-weight: 600; color: #fff;\">This week's one rep<\u002Fspan>\n        <span style=\"font-size: 14px; color: #b9c0e0;\">one project. three checkboxes. that is the whole assignment.<\u002Fspan>\n      <\u002Fdiv>\n      <span style=\"font-size: 18px; color: var(--sand-fresh); font-weight: 700;\">{{ arrB }}<\u002Fspan>\n    <\u002Fdiv>\n    <div data-expand=\"1\" style=\"padding: 18px 20px; display: {{ dB }};\">\n      <div style=\"display: flex; gap: 22px; align-items: flex-start;\">\n        <div style=\"flex: 1; min-width: 0;\">\n          <p style=\"margin: 0 0 12px; font-size: 16px; line-height: 1.5;\">Make one project. Write its instructions with CLEAR. Click the blanks below and type over them, they save as you go.<\u002Fp>\n          <div ref=\"{{ refBlanks }}\" data-k=\"blanks\" sc-camel-on-input=\"{{ onEdit }}\" style=\"background: #f7f8fb; border: 2px solid var(--color-border); border-radius: 10px; padding: 16px 18px; font-size: 15px; line-height: 1.9; color: var(--sand-stable);\">\n            <div>You are helping me run <span sc-camel-content-editable=\"true\" sc-camel-suppress-content-editable-warning=\"{{ yes }}\" style=\"border-bottom: 2px dashed var(--sand-fresh); padding: 2px 6px; background: #eaf8ff; font-weight: 600;\">[YOUR RECURRING PROJECT]<\u002Fspan>.<\u002Fdiv>\n            <div><strong style=\"color: var(--sand-fresh);\">Concise:<\u002Fstrong> answer in <span sc-camel-content-editable=\"true\" sc-camel-suppress-content-editable-warning=\"{{ yes }}\" style=\"border-bottom: 2px dashed var(--sand-fresh); padding: 2px 6px; background: #eaf8ff; font-weight: 600;\">[HOW SHORT]<\u002Fspan>.<\u002Fdiv>\n            <div><strong style=\"color: var(--sand-fresh);\">Limitations:<\u002Fstrong> never <span sc-camel-content-editable=\"true\" sc-camel-suppress-content-editable-warning=\"{{ yes }}\" style=\"border-bottom: 2px dashed var(--sand-fresh); padding: 2px 6px; background: #eaf8ff; font-weight: 600;\">[WHAT IT SHOULD NEVER DO]<\u002Fspan>.<\u002Fdiv>\n            <div><strong style=\"color: var(--sand-fresh);\">Examples:<\u002Fstrong> match the style of <span sc-camel-content-editable=\"true\" sc-camel-suppress-content-editable-warning=\"{{ yes }}\" style=\"border-bottom: 2px dashed var(--sand-fresh); padding: 2px 6px; background: #eaf8ff; font-weight: 600;\">[WHAT GOOD LOOKS LIKE]<\u002Fspan>.<\u002Fdiv>\n            <div><strong style=\"color: var(--sand-fresh);\">Ask:<\u002Fstrong> before drafting, ask me <span sc-camel-content-editable=\"true\" sc-camel-suppress-content-editable-warning=\"{{ yes }}\" style=\"border-bottom: 2px dashed var(--sand-fresh); padding: 2px 6px; background: #eaf8ff; font-weight: 600;\">[HOW MANY]<\u002Fspan> questions.<\u002Fdiv>\n            <div><strong style=\"color: var(--sand-fresh);\">References:<\u002Fstrong> tell me where each fact came from.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex: 0 0 340px; width: 340px;\">\n          <div style=\"font-size: 12px; font-weight: 700; letter-spacing: .14em; color: var(--sand-ink-70); text-transform: uppercase; margin-bottom: 10px;\">Done when<\u002Fdiv>\n          <label style=\"display: flex; gap: 10px; align-items: flex-start; margin-bottom: 12px; font-size: 15px; line-height: 1.4; color: var(--sand-stable); cursor: pointer;\">\n            <input type=\"checkbox\" ref=\"{{ refC1 }}\" data-k=\"c1\" sc-camel-on-change=\"{{ onCheck }}\" style=\"width: 20px; height: 20px; margin-top: 1px; accent-color: #00aded; flex: 0 0 auto;\">\n            <span>Make the project. Name it after your recurring thing.<\u002Fspan>\n          <\u002Flabel>\n          <label style=\"display: flex; gap: 10px; align-items: flex-start; margin-bottom: 12px; font-size: 15px; line-height: 1.4; color: var(--sand-stable); cursor: pointer;\">\n            <input type=\"checkbox\" ref=\"{{ refC2 }}\" data-k=\"c2\" sc-camel-on-change=\"{{ onCheck }}\" style=\"width: 20px; height: 20px; margin-top: 1px; accent-color: #00aded; flex: 0 0 auto;\">\n            <span>Paste your filled-in instructions into it.<\u002Fspan>\n          <\u002Flabel>\n          <label style=\"display: flex; gap: 10px; align-items: flex-start; margin-bottom: 12px; font-size: 15px; line-height: 1.4; color: var(--sand-stable); cursor: pointer;\">\n            <input type=\"checkbox\" ref=\"{{ refC3 }}\" data-k=\"c3\" sc-camel-on-change=\"{{ onCheck }}\" style=\"width: 20px; height: 20px; margin-top: 1px; accent-color: #00aded; flex: 0 0 auto;\">\n            <span>Drag your three most recent related chats into it.<\u002Fspan>\n          <\u002Flabel>\n          <p style=\"margin: 14px 0 0; font-size: 15px; font-weight: 600; color: var(--sand-fresh);\">◈ A project is context that greets every new chat for you.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"border: 2px solid var(--sand-stable); border-radius: 12px; overflow: hidden;\">\n    <div sc-camel-on-click=\"{{ accC }}\" style=\"display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 18px; background: var(--sand-stable); cursor: pointer;\">\n      <div style=\"display: flex; align-items: baseline; gap: 12px;\">\n        <span style=\"font-size: 12px; font-weight: 700; letter-spacing: .16em; color: var(--sand-fresh);\">C<\u002Fspan>\n        <span style=\"font-size: 21px; font-weight: 600; color: #fff;\">Parking lot<\u002Fspan>\n        <span style=\"font-size: 14px; color: #b9c0e0;\">put a pen in it. we will get there.<\u002Fspan>\n      <\u002Fdiv>\n      <span style=\"font-size: 18px; color: var(--sand-fresh); font-weight: 700;\">{{ arrC }}<\u002Fspan>\n    <\u002Fdiv>\n    <div data-expand=\"1\" style=\"padding: 18px 20px; display: {{ dC }};\">\n      <div style=\"font-size: 12px; font-weight: 700; letter-spacing: .14em; color: var(--sand-ink-70); text-transform: uppercase; margin-bottom: 10px;\">Things I want to ask Ben<\u002Fdiv>\n      <div ref=\"{{ refParking }}\" data-k=\"parking\" sc-camel-content-editable=\"true\" sc-camel-suppress-content-editable-warning=\"{{ yes }}\" sc-camel-on-input=\"{{ onEdit }}\" style=\"min-height: 150px; background: repeating-linear-gradient(180deg, #fff, #fff 37px, #e9eaf1 37px, #e9eaf1 38px); border: 2px solid var(--color-border); border-radius: 10px; padding: 8px 18px; font-size: 16px; line-height: 38px; color: var(--sand-stable);\">\n        <div>Connector permissions review. What can Fathom actually see?<\u002Fdiv>\n        <div>Faster background removal.<\u002Fdiv>\n        <div>The Nano Banana image demo.<\u002Fdiv>\n        <div><br><\u002Fdiv>\n        <div><br><\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"margin: 10px 0 0; font-size: 14px; color: var(--sand-ink-70);\">Click anywhere in the lines and type. It saves in this browser.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"margin-top: auto; border-top: 2px solid var(--sand-gray); padding-top: 14px; display: flex; align-items: flex-end; justify-content: space-between; gap: 20px;\">\n    <div style=\"font-size: 17px; font-weight: 600; color: var(--sand-stable);\">Part 2 — Context Windows: why your chat gets dumber the longer it gets.<\u002Fdiv>\n    <div style=\"font-size: 13px; color: var(--sand-ink-70);\">Swap the project name and this works for anyone on the team.<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1120,&quot;height&quot;:900}}\">\nconst TASKS = [\n  { id: 't1', label: 'Reformat the speaker list into a table', ans: 'accept', reason: 'Wrong output is obvious in two seconds.' },\n  { id: 't2', label: 'Rewrite my rough agenda note in plainer words', ans: 'accept', reason: 'Your words, shorter. You would spot a change instantly.' },\n  { id: 't3', label: 'Themes across 200 FBR survey comments', ans: 'verify', reason: 'Spot check ten comments before you quote a number.' },\n  { id: 't4', label: 'Recap doc from a speaker logistics call', ans: 'verify', reason: 'Check the dates and the owners. Those get acted on.' },\n  { id: 't5', label: 'Final budget figures in the leadership deck', ans: 'escalate', reason: 'Numbers with your name on them go past a human.' },\n  { id: 't6', label: 'Email to a franchisee about a schedule change', ans: 'escalate', reason: \"It leaves the building under Sandler's name.\" }\n];\n\nconst OUT = [\n  ['Hi!\\n\\nGreat chatting today. Just following up on our conversation. Let me know if you have any questions or need anything else from me.\\n\\nThanks!', 'Could be any call, any person, any year.'],\n  ['Hi!\\n\\nThanks for the time today on event operations. Wanted to follow up on the items we discussed and keep things moving.\\n\\nTalk soon!', 'It knows the job now. It still has no idea what the call was.'],\n  ['Hi!\\n\\nQuick recap of Tuesday\\u2019s speaker logistics call. We covered travel, the AV walkthrough, and session start times.\\n\\nLet me know if I missed anything.', 'Right call, right scope. Reads like a stranger wrote it.'],\n  ['Hi!\\n\\nQuick recap from Tuesday. Travel is booked for four of the six speakers. The AV walkthrough moved to the 14th. Session times hold as printed.\\n\\nShout if I got any of that wrong!', 'That sounds like you now.'],\n  ['Before I draft, three questions:\\n\\n1. You left the speaker gift count open. Open item, or leave it out?\\n2. Is the 14th confirmed with the venue, or held?\\n3. Who owns the AV vendor call, you or Marcus?', 'It stopped guessing and asked. This is the step everyone skips.'],\n  ['RECAP \\u2014 Speaker logistics, Tuesday\\n\\nDecisions: travel booked for 4 of 6. AV walkthrough moves to the 14th.\\nOpen items: speaker gift count, AV vendor owner.\\nOwners and dates: Marcus, AV vendor call, Friday.\\n\\nINFERRED: I assumed the 14th is confirmed. The transcript only says \"let\\u2019s aim for.\" Check me.', 'Now you can audit the whole thing in ten seconds.']\n];\n\nclass Component extends DCLogic {\n  state = { ring: 1, side: 'race', ri: 0, ci: 0, both: false, step: 0, placed: {}, sel: null, answers: false, acc: 'a', copied: false };\n\n  mkRef(k) {\n    return el => {\n      if (!el) return;\n      this['el_' + k] = el;\n      if (this['done_' + k]) return;\n      this['done_' + k] = true;\n      try {\n        const v = localStorage.getItem('jeni-ctx-' + k);\n        if (v == null) return;\n        if (el.type === 'checkbox') el.checked = v === '1';\n        else el.innerHTML = v;\n      } catch (e) {}\n    };\n  }\n\n  refSkill = this.mkRef('skill');\n  refBlanks = this.mkRef('blanks');\n  refParking = this.mkRef('parking');\n  refC1 = this.mkRef('c1');\n  refC2 = this.mkRef('c2');\n  refC3 = this.mkRef('c3');\n\n  save(k, v) { try { localStorage.setItem('jeni-ctx-' + k, v); } catch (e) {} }\n\n  renderVals() {\n    const s = this.state;\n    const d = b => (b ? 'block' : 'none');\n    const sel = '0 0 0 4px var(--sand-limitless)';\n    const off = '0 2px 6px rgba(33,36,92,.18)';\n    const placed = s.answers ? TASKS.reduce((a, t) => (a[t.id] = t.ans, a), {}) : s.placed;\n\n    const deco = t => ({\n      id: t.id,\n      label: t.label,\n      ring: s.sel === t.id ? sel : off,\n      edge: placed[t.id] === t.ans ? 'var(--sand-fresh)' : 'var(--sand-passionate)',\n      noteColor: placed[t.id] === t.ans ? 'var(--sand-ink-70)' : 'var(--sand-passionate)',\n      note: placed[t.id] === t.ans ? t.reason : 'Not quite. Drag it somewhere else.'\n    });\n    const inBucket = b => TASKS.filter(t => placed[t.id] === b).map(deco);\n\n    const move = (id, bucket) => {\n      this.setState(st => ({ placed: Object.assign({}, st.placed, { [id]: bucket }), sel: null, answers: false }));\n    };\n\n    const v = {\n      yes: true,\n      d1: d(s.ring === 1), d2: d(s.ring === 2), d3: d(s.ring === 3), d4: d(s.ring === 4), d5: d(s.ring === 5),\n      b1: s.ring === 1 ? 'var(--sand-limitless)' : 'transparent',\n      b2: s.ring === 2 ? 'var(--sand-limitless)' : 'transparent',\n      b3: s.ring === 3 ? 'var(--sand-limitless)' : 'transparent',\n      b4: s.ring === 4 ? 'var(--sand-limitless)' : 'transparent',\n      b5: s.ring === 5 ? 'var(--sand-limitless)' : 'transparent',\n      pick1: () => this.setState({ ring: 1 }), pick2: () => this.setState({ ring: 2 }),\n      pick3: () => this.setState({ ring: 3 }), pick4: () => this.setState({ ring: 4 }),\n      pick5: () => this.setState({ ring: 5 }),\n\n      dTurn: s.both ? 'none' : 'flex',\n      dSide: d(s.both),\n      bothLabel: s.both ? 'Back to the turntable' : 'Show me both acronyms side by side',\n      toggleBoth: () => this.setState(st => ({ both: !st.both })),\n      raceRot: (-90 * s.ri) + 'deg',\n      raceCtr: (90 * s.ri) + 'deg',\n      clearRot: (-72 * s.ci) + 'deg',\n      clearCtr: (72 * s.ci) + 'deg',\n      dR0: d(s.side === 'race' && s.ri === 0), dR1: d(s.side === 'race' && s.ri === 1),\n      dR2: d(s.side === 'race' && s.ri === 2), dR3: d(s.side === 'race' && s.ri === 3),\n      dC0: d(s.side === 'clear' && s.ci === 0), dC1: d(s.side === 'clear' && s.ci === 1),\n      dC2: d(s.side === 'clear' && s.ci === 2), dC3: d(s.side === 'clear' && s.ci === 3),\n      dC4: d(s.side === 'clear' && s.ci === 4),\n      sR0: s.side === 'race' && s.ri === 0 ? sel : off, sR1: s.side === 'race' && s.ri === 1 ? sel : off,\n      sR2: s.side === 'race' && s.ri === 2 ? sel : off, sR3: s.side === 'race' && s.ri === 3 ? sel : off,\n      sC0: s.side === 'clear' && s.ci === 0 ? sel : off, sC1: s.side === 'clear' && s.ci === 1 ? sel : off,\n      sC2: s.side === 'clear' && s.ci === 2 ? sel : off, sC3: s.side === 'clear' && s.ci === 3 ? sel : off,\n      sC4: s.side === 'clear' && s.ci === 4 ? sel : off,\n      pR0: () => this.setState({ side: 'race', ri: 0 }), pR1: () => this.setState({ side: 'race', ri: 1 }),\n      pR2: () => this.setState({ side: 'race', ri: 2 }), pR3: () => this.setState({ side: 'race', ri: 3 }),\n      pC0: () => this.setState({ side: 'clear', ci: 0 }), pC1: () => this.setState({ side: 'clear', ci: 1 }),\n      pC2: () => this.setState({ side: 'clear', ci: 2 }), pC3: () => this.setState({ side: 'clear', ci: 3 }),\n      pC4: () => this.setState({ side: 'clear', ci: 4 }),\n\n      step: s.step,\n      onStep: e => this.setState({ step: Number(e.target.value) }),\n      o1: s.step >= 1 ? 1 : 0.16, o2: s.step >= 2 ? 1 : 0.16, o3: s.step >= 3 ? 1 : 0.16,\n      o4: s.step >= 4 ? 1 : 0.16, o5: s.step >= 5 ? 1 : 0.16,\n      outBody: OUT[s.step][0],\n      outVerdict: OUT[s.step][1],\n\n      trayItems: TASKS.filter(t => !placed[t.id]).map(deco),\n      acceptItems: inBucket('accept'),\n      verifyItems: inBucket('verify'),\n      escalateItems: inBucket('escalate'),\n      onDragStart: e => { e.dataTransfer.setData('text/plain', e.currentTarget.dataset.id); e.dataTransfer.effectAllowed = 'move'; },\n      onDragOver: e => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; },\n      onDrop: e => { e.preventDefault(); const id = e.dataTransfer.getData('text/plain'); if (id) move(id, e.currentTarget.dataset.bucket); },\n      onChipClick: e => { const id = e.currentTarget.dataset.id; this.setState(st => ({ sel: st.sel === id ? null : id })); },\n      onBucketClick: e => { if (s.sel) move(s.sel, e.currentTarget.dataset.bucket); },\n      dKey: d(s.answers),\n      answersLabel: s.answers ? 'Hide the answers' : 'Show me the answers',\n      toggleAnswers: () => this.setState(st => ({ answers: !st.answers, sel: null })),\n\n      dA: d(s.acc === 'a'), dB: d(s.acc === 'b'), dC: d(s.acc === 'c'),\n      arrA: s.acc === 'a' ? '\\u2013' : '+', arrB: s.acc === 'b' ? '\\u2013' : '+', arrC: s.acc === 'c' ? '\\u2013' : '+',\n      accA: () => this.setState(st => ({ acc: st.acc === 'a' ? '' : 'a' })),\n      accB: () => this.setState(st => ({ acc: st.acc === 'b' ? '' : 'b' })),\n      accC: () => this.setState(st => ({ acc: st.acc === 'c' ? '' : 'c' })),\n\n      refSkill: this.refSkill, refBlanks: this.refBlanks, refParking: this.refParking,\n      refC1: this.refC1, refC2: this.refC2, refC3: this.refC3,\n      onEdit: e => this.save(e.currentTarget.dataset.k, e.currentTarget.innerHTML),\n      onCheck: e => this.save(e.currentTarget.dataset.k, e.currentTarget.checked ? '1' : '0'),\n      copyLabel: s.copied ? 'Copied' : 'Copy',\n      copySkill: () => {\n        const txt = this.el_skill ? this.el_skill.innerText : '';\n        try { navigator.clipboard.writeText(txt); } catch (e) {}\n        this.setState({ copied: true });\n        setTimeout(() => this.setState({ copied: false }), 1800);\n      }\n    };\n    return v;\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
